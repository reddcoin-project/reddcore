services:
  database:
    image: mongo:4.4
    # WT cache cap + container mem limit — required on 8 GB. Without
    # them Mongo would default to ~3.5 GB WT cache + uncapped runtime,
    # and the host would thrash under bitcore-node + reddcoind load.
    command: ["mongod", "--bind_ip_all", "--wiredTigerCacheSizeGB=3"]
    mem_limit: 4g
    memswap_limit: 4g
    # ports: 27017 deliberately not bound to host — bitcore-node
    # connects via the internal compose network using hostname `database`.
    # Binding to the host bypasses UFW and exposes unauth mongo to the
    # internet. See docs/deployment.md §7.
    volumes:
      - ${BITCORE_MONGO_DATA:-/data/db}:/data/db
    # nofile bumped to 64k so allowDiskUse spill files don't OOM the
    # container during heavy aggregations.
    ulimits:
      nofile:
        soft: 64000
        hard: 64000
    restart: unless-stopped

  reddcoin:
    image: reddcoincore/reddcoind:v4.22.9
    # Image user is uid/gid 1000; the host volume mount must match.
    user: "1000:1000"
    ports:
      - "45444:45444"                  # P2P — exposed for inbound peers
      - "127.0.0.1:45443:45443"        # RPC — localhost only (debugging)
    volumes:
      - /var/lib/reddcoind:/home/reddcoind/.reddcoin
    environment:
      # setup.sh inside the image reads these on first run and writes
      # ~/.reddcoin/reddcoin.conf. Subsequent runs skip the rewrite.
      - RPC_SERVER=1
      - RPC_USERNAME=bitcorenodetest
      - RPC_PASSWORD=local321
      - RPC_ALLOW_IP=172.16.0.0/12     # Docker network range
      - RPC_PORT=45443
      - RPC_BIND=0.0.0.0
      - ZMQ_PUBRAWBLOCK=tcp://0.0.0.0:28332
      - ZMQ_PUBRAWTX=tcp://0.0.0.0:28333
      - DAEMON_OPTION_PRINTTOCONSOLE=1
      - DAEMON_OPTION_TXINDEX=1
      - TESTNET=0
    restart: unless-stopped

  bitcore-node:
    # Package-specific multi-stage Dockerfile (slim runtime), not the
    # root /Dockerfile which is the test-runner image.
    build:
      context: .
      dockerfile: packages/bitcore-node/Dockerfile
    image: bitcore-node
    depends_on:
      - database
      - reddcoin
    ports:
      - "3000:3000"
    environment:
      - DB_HOST=database
    volumes:
      # Mount the (gitignored) operator config read-only into the image's
      # default config path.
      - ./bitcore.config.json:/bitcore/bitcore.config.json:ro
    restart: unless-stopped
